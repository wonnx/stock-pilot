[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-pilot"
version = "0.1.0"
description = "US stock analysis and alert service for short/swing trading"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "edge-tts>=6.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
]

[project.scripts]
stock-pilot = "stock_pilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_pilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/stock_pilot"]
