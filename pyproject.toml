[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-snap"
version = "0.1.0"
description = "US stock analysis and alert service for short/swing trading"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "edge-tts>=6.1.9",
    "gtts>=2.5.4",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
monitoring = [
    "sentry-sdk>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
]

[project.scripts]
stock-snap = "stock_snap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_snap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_defs = false
disable_error_code = ["no-any-return", "type-arg", "unused-ignore", "union-attr", "assignment", "arg-type", "operator", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/stock_snap"]

[dependency-groups]
dev = [
    "pynacl>=1.6.2",
]
