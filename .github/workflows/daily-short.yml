name: Daily Stock Short

on:
  schedule:
    # 매일 오전 9:30 KST = 00:30 UTC
    - cron: "30 0 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip upload)"
        required: false
        default: "false"

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Node.js (for Remotion rendering)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -e "."

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Pre-download Remotion browser
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # YouTube OAuth2 refresh token flow (preferred)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Legacy static access token fallback (optional)
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Release assets give the rendered video a public URL for the Graph API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python run_live_short.py

      - name: Notify failure via Kakao
        if: failure()
        env:
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$KAKAO_ACCESS_TOKEN" ]; then
            curl -s -X POST "https://kapi.kakao.com/v2/api/talk/memo/default/send" \
              -H "Authorization: Bearer $KAKAO_ACCESS_TOKEN" \
              -d "template_object=%7B%22object_type%22%3A%22text%22%2C%22text%22%3A%22%5BStock+Pilot%5D+%E2%9D%8C+GitHub+Actions+%ED%8C%8C%EC%9D%B4%ED%94%84%EB%9D%BC%EC%9D%B8+%EC%8B%A4%ED%8C%A8%5Cn%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9C%EC%9A%B0%3A+daily-short.yml%5CnRun+ID%3A+$GITHUB_RUN_ID%5Cn%ED%99%95%EC%9D%B8%3A+https%3A%2F%2Fgithub.com%2Fwonnx%2Fstock-pilot%2Factions%2Fruns%2F$GITHUB_RUN_ID%22%2C%22link%22%3A%7B%22web_url%22%3A%22https%3A%2F%2Fgithub.com%2Fwonnx%2Fstock-pilot%2Factions%2Fruns%2F$GITHUB_RUN_ID%22%7D%7D"
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: output/
          retention-days: 3
